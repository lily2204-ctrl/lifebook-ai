<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lifebook — הזמנות דפוס</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --cream:#fdf6ec; --gold:#c9a84c; --dark:#2c1a0e; --card-bg:#fff; --radius:14px; }
    body { font-family:'Heebo',sans-serif; background:var(--cream); color:var(--dark); min-height:100vh; }

    header {
      background:var(--dark); color:#fff; padding:16px 32px;
      display:flex; align-items:center; justify-content:space-between;
    }
    header h1 { font-size:1.2rem; font-weight:600; }
    #logoutBtn {
      background:transparent; border:1px solid rgba(255,255,255,0.4); color:#fff;
      padding:6px 16px; border-radius:6px; cursor:pointer; font-family:inherit; font-size:0.85rem;
    }
    #logoutBtn:hover { background:rgba(255,255,255,0.1); }

    .screen { display:none; padding:40px 32px; max-width:960px; margin:0 auto; }
    .screen.active { display:block; }

    #loginScreen { display:none; align-items:center; justify-content:center; min-height:100vh; padding:0; max-width:unset; }
    #loginScreen.active { display:flex; }
    .login-box {
      background:var(--card-bg); border-radius:var(--radius); padding:40px 48px; width:380px;
      box-shadow:0 4px 24px rgba(0,0,0,0.10); text-align:center;
    }
    .login-box h2 { margin-bottom:28px; font-size:1.4rem; }
    .login-box input {
      width:100%; padding:12px 16px; margin-bottom:14px; border:1px solid #ddd; border-radius:8px;
      font-family:inherit; font-size:1rem; direction:ltr; text-align:left;
    }
    .login-box input:focus { outline:2px solid var(--gold); border-color:transparent; }
    .btn-primary {
      background:var(--gold); color:#fff; border:none; border-radius:8px; padding:13px 32px;
      font-family:inherit; font-size:1rem; font-weight:600; cursor:pointer; width:100%;
    }
    .btn-primary:hover { filter:brightness(1.1); }
    .btn-primary:disabled { opacity:0.5; cursor:default; filter:none; }
    #loginError { color:#c0392b; font-size:0.88rem; margin-top:12px; min-height:20px; }

    #ordersScreen h2 { font-size:1.5rem; margin-bottom:8px; }
    #ordersSubtitle { color:#666; margin-bottom:28px; font-size:0.95rem; }

    .order-card {
      background:var(--card-bg); border-radius:var(--radius); padding:22px 24px; margin-bottom:18px;
      box-shadow:0 2px 12px rgba(0,0,0,0.07); border:1px solid #ede0c8;
    }
    .order-head { display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px; }
    .order-head h3 { font-size:1.1rem; }
    .order-badge {
      display:inline-block; background:#f5ede0; color:#8a6d2a; font-size:0.78rem; font-weight:600;
      padding:3px 12px; border-radius:20px;
    }
    .order-date { color:#999; font-size:0.82rem; }
    .order-ship { color:#555; font-size:0.88rem; line-height:1.7; margin:14px 0; white-space:pre-line; }
    .order-links { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
    .order-links a {
      color:var(--gold); font-weight:600; font-size:0.9rem; text-decoration:none;
      border:1px solid var(--gold); border-radius:8px; padding:8px 16px;
    }
    .order-links a:hover { background:#fdf3de; }
    .order-links .missing { color:#c0392b; border:none; padding:0; font-weight:400; }
    .approve-btn {
      background:var(--gold); color:#fff; border:none; border-radius:8px; padding:12px 28px;
      font-family:inherit; font-size:0.98rem; font-weight:700; cursor:pointer;
    }
    .approve-btn:hover { filter:brightness(1.1); }
    .approve-btn:disabled { opacity:0.5; cursor:default; filter:none; }
    .genpdf-btn {
      background:transparent; border:1px solid var(--gold); color:var(--gold); border-radius:8px;
      padding:12px 22px; font-family:inherit; font-size:0.95rem; font-weight:600; cursor:pointer;
      margin-left:10px;
    }
    .genpdf-btn:hover { background:#fdf3de; }
    .genpdf-btn:disabled { opacity:0.5; cursor:default; background:transparent; }
    /* A held order must never be mistaken for an actionable one. */
    .order-card.held { background:#faf2f0; border-color:#e2b3a6; border-inline-start:6px solid #c0392b; box-shadow:none; }
    .order-card.held .order-head h3 { color:#8c3a2a; }
    .held-badge {
      display:inline-block; background:#c0392b; color:#fff; font-size:0.78rem; font-weight:700;
      padding:3px 12px; border-radius:20px;
    }
    .held-note { color:#8c3a2a; font-size:0.88rem; font-weight:600; line-height:1.6; margin:12px 0 4px; }
    .order-result { margin-top:12px; font-size:0.9rem; min-height:20px; }
    .order-result.ok  { color:#1e7a3c; }
    .order-result.err { color:#c0392b; }
    #ordersEmpty, #ordersError { color:#888; margin-top:16px; }
    #ordersError { color:#c0392b; }
    #refreshBtn, #checkConnBtn {
      background:transparent; border:1px solid var(--gold); color:var(--gold); border-radius:8px;
      padding:8px 20px; font-family:inherit; font-size:0.9rem; cursor:pointer; margin-bottom:24px;
    }
    #refreshBtn:hover, #checkConnBtn:hover { background:#fdf3de; }
    #checkConnBtn { margin-right:8px; }
    #checkConnBtn:disabled { opacity:0.5; cursor:default; background:transparent; }
    #connResult { margin:-12px 0 20px; font-size:0.9rem; white-space:pre-line; word-break:break-all; line-height:1.7; }
    #connResult.ok  { color:#1e8449; }
    #connResult.err { color:#c0392b; }
    /* Read a book's name back out of the Bookpod account. Read-only, no cost. */
    #verifyRow { display:flex; gap:8px; align-items:center; margin:-8px 0 20px; flex-wrap:wrap; }
    #verifyIdInput {
      border:1px solid #e0d5c0; border-radius:8px; padding:8px 12px;
      font-family:inherit; font-size:0.9rem; width:220px; background:#fff; color:var(--dark);
    }
    #verifyBtn {
      background:transparent; border:1px solid var(--gold); color:var(--gold); border-radius:8px;
      padding:8px 20px; font-family:inherit; font-size:0.9rem; cursor:pointer;
    }
    #verifyBtn:hover { background:#fdf3de; }
    #verifyBtn:disabled { opacity:0.5; cursor:default; background:transparent; }
    #verifyResult { font-size:0.9rem; }
    #verifyResult.ok  { color:#1e8449; }
    #verifyResult.err { color:#c0392b; }
    .order-bookpod { font-size:0.85rem; color:#7a6a55; margin-top:10px; }
    .order-bookpod code { background:#f6efe2; padding:2px 6px; border-radius:4px; }
    .verify-card-btn {
      background:transparent; border:1px solid #d8c9a8; color:#8a7550; border-radius:6px;
      padding:4px 12px; font-family:inherit; font-size:0.82rem; cursor:pointer; margin-inline-start:8px;
    }
    .verify-card-btn:hover { background:#fdf3de; }
    .verify-card-btn:disabled { opacity:0.5; cursor:default; }
  </style>
</head>
<body>

<header id="appHeader" style="display:none">
  <h1>🖨️ Lifebook — הזמנות דפוס</h1>
  <button id="logoutBtn">התנתק</button>
</header>

<!-- ── Login ── -->
<div id="loginScreen" class="screen active">
  <div class="login-box">
    <h2>כניסה לממשק</h2>
    <input type="text"     id="usernameInput" placeholder="שם משתמש" autocomplete="username">
    <input type="password" id="passwordInput" placeholder="סיסמה"     autocomplete="current-password">
    <button class="btn-primary" id="loginBtn">כניסה</button>
    <div id="loginError"></div>
  </div>
</div>

<!-- ── Orders ── -->
<div id="ordersScreen" class="screen">
  <h2>הזמנות דפוס ממתינות לאישור</h2>
  <p id="ordersSubtitle">בדקי את שני קובצי ה-PDF, ואז לחצי «אשר ושלח לדפוס». הלחיצה יוצרת את ההזמנה בבוקפוד ומנצלת קרדיט.</p>
  <button id="refreshBtn">↻ רענן</button>
  <button id="checkConnBtn">בדוק חיבור לבוקפוד</button>
  <div id="connResult"></div>
  <div id="verifyRow">
    <input type="text" id="verifyIdInput" placeholder="מזהה ספר בבוקפוד" inputmode="numeric">
    <button id="verifyBtn">בדוק שם ספר</button>
    <span id="verifyResult"></span>
  </div>
  <div id="ordersList"></div>
  <div id="ordersEmpty" style="display:none">אין כרגע הזמנות דפוס הממתינות לאישור.</div>
  <div id="ordersError"></div>
</div>

<script>
let token = sessionStorage.getItem("adminToken") || null;

const FMT_LABEL = { printed: "ספר מודפס", bundle: "חבילה דיגיטלי+מודפס", digital: "דיגיטלי" };

// Orders the owner has deliberately put on hold. They keep their row and their
// files so nothing is lost, but the station must make it impossible to mistake
// one for a live order and send it to print by accident.
//
// Keyed by print-order id rather than by Shopify order number, because the list
// endpoint does not return the Shopify number and marking these needs no server
// change. The id identifies the order itself, so re-ordering the same book later
// would correctly produce a new, unheld card. The Shopify number the owner
// recognises is spelled out in the note. Remove an entry to release the order.
const HELD_ORDERS = {
  "1": "הזמנת שופיפיי 7255021748470 — מושהית בהוראת הבעלים. לא לשלוח לדפוס ולא להפיק מחדש."
};

(function boot() {
  if (token) { showScreen("orders"); loadOrders(); }
  else        { showScreen("login"); }
})();

function showScreen(name) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(name + "Screen").classList.add("active");
  document.getElementById("appHeader").style.display = (name === "login") ? "none" : "flex";
}

// ── Login ──
document.getElementById("loginBtn").addEventListener("click", doLogin);
document.getElementById("passwordInput").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

async function doLogin() {
  const username = document.getElementById("usernameInput").value.trim();
  const password = document.getElementById("passwordInput").value;
  const errEl = document.getElementById("loginError");
  const btn   = document.getElementById("loginBtn");
  errEl.textContent = "";
  btn.disabled = true;
  try {
    const res  = await fetch("/api/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || "שגיאת התחברות"; return; }
    token = data.token;
    sessionStorage.setItem("adminToken", token);
    showScreen("orders");
    loadOrders();
  } catch {
    errEl.textContent = "שגיאת רשת — נסי שוב";
  } finally {
    btn.disabled = false;
  }
}

document.getElementById("logoutBtn").addEventListener("click", () => {
  token = null;
  sessionStorage.removeItem("adminToken");
  showScreen("login");
});

document.getElementById("refreshBtn").addEventListener("click", loadOrders);

// Verifies the Bookpod credentials without producing anything: it only asks for
// upload slots. No book, no file, no credits.
document.getElementById("checkConnBtn").addEventListener("click", async (e) => {
  const btn = e.currentTarget;
  const out = document.getElementById("connResult");
  btn.disabled = true;
  out.className = "";
  out.textContent = "בודק חיבור...";
  try {
    const res  = await apiFetch("/api/admin/bookpod/check", { method: "POST" });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.ok) {
      out.className = "ok";
      // Show the storage address a real run would attach to the book, not just a
      // green tick: this is the one part of the flow that is otherwise invisible.
      out.textContent = "✅ " + (data.message || "החיבור תקין")
        + (data.contentGsUri ? "\nיעד הקבצים: " + data.contentGsUri : "");
    } else {
      out.className = "err";
      out.textContent = "❌ " + (data.error || `נכשל (HTTP ${res.status})`);
    }
  } catch {
    out.className = "err";
    out.textContent = "❌ שגיאת רשת — נסי שוב";
  }
  btn.disabled = false;
});

// Reads a book's name back out of the Bookpod account. Their API has no rename
// and no delete, so this answers the only question that matters after a book is
// created: what name is now stuck on it. Read-only — creates nothing, costs
// nothing. Returns a {ok, title, ...} object, or null on a network failure.
async function verifyBookpodBook(bookpodBookId) {
  const res  = await apiFetch("/api/admin/bookpod/verify", {
    method: "POST",
    body:   JSON.stringify({ bookpodBookId }),
  });
  if (res.status === 401) { handleExpiredToken(); return null; }
  const data = await res.json().catch(() => ({}));
  if (!res.ok && !data.error) data.error = `נכשל (HTTP ${res.status})`;
  return data;
}

document.getElementById("verifyBtn").addEventListener("click", async (e) => {
  const btn = e.currentTarget;
  const out = document.getElementById("verifyResult");
  const id  = document.getElementById("verifyIdInput").value.trim();
  if (!id) {
    out.className = "err";
    out.textContent = "❌ הזיני מזהה ספר";
    return;
  }
  btn.disabled = true;
  out.className = "";
  out.textContent = "בודק...";
  try {
    const data = await verifyBookpodBook(id);
    if (!data) return;
    if (data.ok) {
      out.className = "ok";
      out.textContent = `✅ ${data.title || "(ללא שם)"}`;
      out.title = data.description ? `תיאור: ${data.description}` : "";
    } else {
      out.className = "err";
      out.textContent = "❌ " + (data.error || "לא נמצא");
    }
  } catch {
    out.className = "err";
    out.textContent = "❌ שגיאת רשת — נסי שוב";
  }
  btn.disabled = false;
});

function handleExpiredToken() {
  token = null;
  sessionStorage.removeItem("adminToken");
  showScreen("login");
  document.getElementById("loginError").textContent = "פג תוקף ה-session — התחברי מחדש";
}

// ── Orders ──
async function loadOrders() {
  const list  = document.getElementById("ordersList");
  const empty = document.getElementById("ordersEmpty");
  const errEl = document.getElementById("ordersError");
  errEl.textContent = "";
  empty.style.display = "none";
  list.innerHTML = "<p style='color:#888'>טוען הזמנות...</p>";
  try {
    const res  = await apiFetch("/api/admin/print-orders");
    if (res.status === 401) { handleExpiredToken(); return; }
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || "שגיאה בטעינה"; list.innerHTML = ""; return; }
    renderOrders(data.orders || []);
  } catch {
    list.innerHTML = "";
    errEl.textContent = "שגיאת רשת בטעינת ההזמנות";
  }
}

function renderOrders(orders) {
  const list  = document.getElementById("ordersList");
  const empty = document.getElementById("ordersEmpty");
  list.innerHTML = "";
  if (!orders.length) { empty.style.display = "block"; return; }

  orders.forEach(o => {
    const card = document.createElement("div");
    card.className = "order-card";

    const dateStr = o.createdAt ? new Date(o.createdAt).toLocaleString("he-IL") : "";
    const s = o.shipping || {};
    const shipLines = [
      s.name    ? "👤 " + s.name : "",
      s.phone   ? "📞 " + s.phone : "",
      s.email   ? "✉️ " + s.email : "",
      (s.address || s.city) ? "📍 " + [s.address, s.city, s.zip].filter(Boolean).join(", ") : ""
    ].filter(Boolean).join("\n");

    const contentLink = o.contentPdfUrl
      ? `<a href="${o.contentPdfUrl}" target="_blank">📄 קובץ פנים</a>`
      : `<span class="missing">קובץ פנים חסר</span>`;
    const coverLink = o.coverPdfUrl
      ? `<a href="${o.coverPdfUrl}" target="_blank">📕 קובץ כריכה</a>`
      : `<span class="missing">קובץ כריכה חסר</span>`;
    // Approval sends the reviewed files as-is, so it stays locked until both exist.
    const hasPdfs   = !!(o.contentPdfUrl && o.coverPdfUrl);
    const heldNote  = HELD_ORDERS[String(o.id)] || null;
    if (heldNote) card.classList.add("held");

    // The generate button used to appear only when a file was missing, which left
    // no way to rebuild an order whose files were already produced — the ordinary
    // case after a fix to the print generator. It is now always offered, and only
    // its wording changes, so a rerun never depends on first deleting something.
    const genLabel = hasPdfs ? "🔄 הפק מחדש" : "הפק קבצים";

    card.innerHTML = `
      <div class="order-head">
        <h3>${o.childName || "(ללא שם)"}</h3>
        <span class="${heldNote ? "held-badge" : "order-badge"}">${heldNote ? "⛔ מוחזקת — לא לאישור" : (FMT_LABEL[o.format] || o.format)}</span>
      </div>
      <div class="order-date">${dateStr}</div>
      ${heldNote ? `<div class="held-note">${heldNote}</div>` : ""}
      <div class="order-ship">${shipLines || "— אין פרטי משלוח —"}</div>
      <div class="order-links">${contentLink}${coverLink}</div>
      ${o.bookpodBookId ? `
      <div class="order-bookpod">
        📗 ספר בבוקפוד: <code>${o.bookpodBookId}</code>
        <button class="verify-card-btn" data-bpid="${o.bookpodBookId}">בדוק שם</button>
        <span class="verify-card-out"></span>
      </div>` : ""}
      <button class="approve-btn" data-id="${o.id}"${(hasPdfs && !heldNote) ? "" : " disabled"}>אשר ושלח לדפוס</button>
      <button class="genpdf-btn" data-id="${o.id}"${heldNote ? " disabled" : ""}>${genLabel}</button>
      <div class="order-result" id="result-${o.id}">${hasPdfs ? "" : "יש להפיק את הקבצים ולבדוק אותם לפני האישור"}</div>
    `;

    const btn = card.querySelector(".approve-btn");
    if (heldNote) btn.title = heldNote;
    btn.addEventListener("click", () => approveOrder(o, btn));
    const genBtn = card.querySelector(".genpdf-btn");
    if (heldNote) genBtn.title = heldNote;
    genBtn.addEventListener("click", () => generatePdfs(o, genBtn, hasPdfs));

    const vBtn = card.querySelector(".verify-card-btn");
    if (vBtn) {
      const vOut = card.querySelector(".verify-card-out");
      vBtn.addEventListener("click", async () => {
        vBtn.disabled = true;
        vOut.style.color = "#7a6a55";
        vOut.textContent = " בודק...";
        try {
          const data = await verifyBookpodBook(vBtn.dataset.bpid);
          if (!data) return;
          vOut.style.color = data.ok ? "#1e7a3c" : "#c0392b";
          vOut.textContent = data.ok
            ? ` ✅ ${data.title || "(ללא שם)"}`
            : ` ❌ ${data.error || "לא נמצא"}`;
        } catch {
          vOut.style.color = "#c0392b";
          vOut.textContent = " ❌ שגיאת רשת";
        }
        vBtn.disabled = false;
      });
    }

    list.appendChild(card);
  });
}

// A regenerated file keeps its URL: storage upserts onto a fixed path per book.
// So "does the file exist" cannot tell us a rerun has finished — only a change in
// the object itself can. Last-Modified and Content-Length are both CORS-safelisted
// response headers, so they are readable here without any server change.
async function pdfFingerprint(url) {
  if (!url) return null;
  try {
    const res = await fetch(url, { method: "HEAD", cache: "no-store" });
    if (!res.ok) return null;
    return (res.headers.get("last-modified") || "") + "|" + (res.headers.get("content-length") || "");
  } catch {
    return null;   // unreadable — treated as "no baseline", i.e. wait for existence
  }
}

// Produces the two print PDFs for an order. isRegen means both files already
// exist and are about to be replaced in place.
// Never reaches Bookpod — the owner still reviews and approves afterwards.
async function generatePdfs(order, btn, isRegen) {
  const resultEl   = document.getElementById("result-" + order.id);
  const approveBtn = btn.parentElement.querySelector(".approve-btn");

  if (isRegen) {
    const ok = window.confirm(
      `להפיק מחדש את קובצי הדפוס של ${order.childName || "הלקוח"}?\n` +
      `שני הקבצים הקיימים יוחלפו — הקישורים יישארו זהים.\n` +
      `ההפקה מנצלת קרדיטים של הגדלת איורים. בוקפוד לא מעורב.`
    );
    if (!ok) return;
  }

  // Read the current files BEFORE asking for new ones, so the poll below has
  // something to compare against.
  const before = isRegen
    ? { content: await pdfFingerprint(order.contentPdfUrl), cover: await pdfFingerprint(order.coverPdfUrl) }
    : { content: null, cover: null };

  btn.disabled = true;
  // The old files are still sitting behind the same links while the rerun works.
  // Approving now would send exactly the file this rerun exists to replace.
  if (approveBtn) approveBtn.disabled = true;
  resultEl.className = "order-result";
  resultEl.textContent = "מפיק קבצים... (יכול לקחת כמה דקות — אל תסגרי את הדף)";
  try {
    const res  = await apiFetch(`/api/admin/print-orders/${order.id}/generate-pdfs`, { method: "POST" });
    if (res.status === 401) { handleExpiredToken(); return; }
    const data = await res.json();
    if (!res.ok) {
      resultEl.className = "order-result err";
      resultEl.textContent = "שגיאה: " + (data.error || "ההפקה נכשלה");
      btn.disabled = false;
      if (approveBtn) approveBtn.disabled = false;
      return;
    }
    // Generation runs in the background — poll until the files change (or appear).
    pollForPdfs(order.id, resultEl, btn, approveBtn, before);
  } catch {
    resultEl.className = "order-result err";
    resultEl.textContent = "שגיאת רשת — נסי שוב";
    btn.disabled = false;
    if (approveBtn) approveBtn.disabled = false;
  }
}

// Poll until both PDFs are genuinely new (or ~12 minutes pass).
// `before` holds the fingerprints captured before the run: null for a file that
// did not exist, in which case appearing at all is the completion signal.
function pollForPdfs(orderId, resultEl, btn, approveBtn, before) {
  const deadline = Date.now() + 12 * 60 * 1000;
  const tick = async () => {
    try {
      const res = await apiFetch("/api/admin/print-orders");
      if (res.status === 401) { handleExpiredToken(); return; }
      const data = await res.json();
      const o = (data.orders || []).find(x => String(x.id) === String(orderId));
      if (o && o.contentPdfUrl && o.coverPdfUrl) {
        const now = {
          content: await pdfFingerprint(o.contentPdfUrl),
          cover:   await pdfFingerprint(o.coverPdfUrl)
        };
        const replaced = (!before.content || now.content !== before.content)
                      && (!before.cover   || now.cover   !== before.cover);
        if (replaced) {
          resultEl.className = "order-result ok";
          resultEl.textContent = "✅ הקבצים הופקו — בדקי אותם לפני האישור";
          setTimeout(loadOrders, 800);
          return;
        }
      }
    } catch { /* transient — keep polling */ }
    if (Date.now() > deadline) {
      resultEl.className = "order-result err";
      resultEl.textContent = "ההפקה לא הסתיימה בזמן — בדקי את יומן השרת ונסי שוב";
      btn.disabled = false;
      if (approveBtn) approveBtn.disabled = false;
      return;
    }
    setTimeout(tick, 10000);
  };
  setTimeout(tick, 10000);
}

async function approveOrder(order, btn) {
  const resultEl = document.getElementById("result-" + order.id);
  const ok = window.confirm(
    `לשלוח לדפוס את הספר של ${order.childName || "הלקוח"}?\n` +
    `יישלחו לבוקפוד בדיוק שני הקבצים שבדקת, ללא ייצור מחדש.\n` +
    `פעולה זו יוצרת הזמנה אמיתית בבוקפוד ומנצלת קרדיט.`
  );
  if (!ok) return;

  btn.disabled = true;
  resultEl.className = "order-result";
  resultEl.textContent = "שולח לדפוס... (יכול לקחת דקה)";
  try {
    const res  = await apiFetch(`/api/admin/print-orders/${order.id}/approve`, { method: "POST" });
    if (res.status === 401) { handleExpiredToken(); return; }
    const data = await res.json();
    if (!res.ok) {
      resultEl.className = "order-result err";
      resultEl.textContent = "שגיאה: " + (data.error || "נכשל");
      btn.disabled = false;
      return;
    }
    resultEl.className = "order-result ok";
    resultEl.textContent = `✅ נשלח לדפוס — מזהה הזמנה בבוקפוד: ${data.bookpodOrderId}`;
    btn.textContent = "נשלח ✓";
    setTimeout(loadOrders, 1500);
  } catch {
    resultEl.className = "order-result err";
    resultEl.textContent = "שגיאת רשת — נסי שוב";
    btn.disabled = false;
  }
}

function apiFetch(url, options = {}) {
  return fetch(url, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${token}`,
      ...(options.headers || {})
    }
  });
}
